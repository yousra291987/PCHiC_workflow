outdir: "results"

# Restriction design (kept unchanged)
design:
  dir: "design/MM10_HindIII"
  rmap: "design/MM10_HindIII/MM10_HindIII.rmap"
  baitmap: "design/MM10_HindIII/MM10_HindIII.baitmap"
  probeinfo: "design/MM10_HindIII/MM10_HindIII_ProbeInfo.txt"

# Per-sample FASTQs (absolute or relative paths). Add as many samples as you like.
# Each sample may provide EITHER a single pair (r1/r2) OR several pairs via
# `fastqs:` to merge technical replicates (HiCUP combines them into one BAM).
samples:
  CI1:                                  # single pair (legacy form) — still works
    r1: "data/CI1_R1.fastq.gz"
    r2: "data/CI1_R2.fastq.gz"
  # Example: a sample with multiple technical replicates (merged by HiCUP).
  # CI2:
  #   fastqs:
  #     - r1: "data/CI2_rep1_R1.fastq.gz"
  #       r2: "data/CI2_rep1_R2.fastq.gz"
  #     - r1: "data/CI2_rep2_R1.fastq.gz"
  #       r2: "data/CI2_rep2_R2.fastq.gz"

# HiCUP + mapping settings
hicup:
  bowtie2_bin: "/usr/bin/bowtie2"                 # or env path
  index: "design/MM10_HindIII/mm10"               # prefix (no .bt2)
  digest: "design/MM10_HindIII/MM10_HindIII_digest.txt"
  format: ""                                      # let HiCUP auto-detect
  longest: 2000
  shortest: 100
  threads: 4
  quiet: 1
  keep: 0
  zip: 0

tools:
  rscript: "Rscript"
  hicup: "hicup"                           # in PATH or full path
  bedtools: "bedtools"
  perl: "perl"
  bam_to_fragments: "scripts/BamToFragments.pl"
  bam2juicer: "scripts/Bam2Juicer.pl"
  align2ibed: "scripts/align2ibed.pl"
  java: "java"
  # REQUIRED for the .hic step: absolute path to the juicer_tools jar.
  # The value below is only a placeholder — download juicer_tools and point to it,
  # e.g. "/path/to/juicer_tools.1.22.01.jar".
  juicer_tools: "juicer_tools.jar"
  # REQUIRED for the CHiCAGO step: paths to the chicagoTools scripts
  # (distributed separately from the Chicago R package; see the README).
  # Leave empty to skip CHiCAGO — the chicago rule will then stop with a clear
  # message rather than run on missing inputs.
  chicago_bam2chicago: ""                  # e.g. "/path/to/chicagoTools/bam2chicago.sh"
  chicago_make_design: ""                  # e.g. "/path/to/chicagoTools/makeDesignFiles_py3.py"
  python: "python"                         # used by makeDesignFiles_py3.py

# CHiCAGO options
chicago:
  # Set true the first time (or when design/rmap/baitmap change) to build the
  # CHiCAGO design files (.npb/.nbpb/.poe) into `design.dir` with makeDesignFiles.
  # Requires tools.chicago_make_design to be set.
  force_make_design: false

# Turn individual steps on/off. Each defaults to true if omitted. Set a step to
# false to skip it entirely (it won't be requested, so its rule never runs) —
# e.g. set `chicago: false` if you can't install/run CHiCAGO, or `hic_and_tads`
# / `insulation: false` if you don't have juicer_tools / FAN-C.
# (insulation needs the .hic, so it only runs when hic_and_tads is also true.)
steps:
  capture_efficiency: true
  chicago: true
  chicmaxima: true
  hic_and_tads: true
  insulation: true

params:
  juicer_mem_gb: 10
  juicer_q: 10
  juicer_genome_id: "mm10"
  fanc_resolution: "10kb"
  fanc_balancing: "KR"
  fanc_windows: ["0.5mb","1mb","1.5mb","2mb","2.5mb"]

threads:
  default: 4
