name: snakemake-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          environment-name: snakemake-ci
          # Tell micromamba where to find packages
          condarc: |
            channels:
              - conda-forge
              - bioconda
              - defaults
            channel_priority: strict
          # Create env with the tools you need
          create-args: >-
            python=3.11
            snakemake-minimal=7.*
            snakefmt=0.8.*
            pytest
            graphviz
            perl
            r-base
            r-optparse
            r-data.table
          cache-environment: true

      - name: Snakemake version
        run: |
          snakemake --version
          python --version

      # 1) Style & lint
      - name: snakefmt (check only)
        run: snakefmt --check .
        continue-on-error: true

      - name: snakemake lint
        run: snakemake --lint --configfile config/config-ci.yaml
        continue-on-error: true

      # 2) Dry-run DAG using your config
      #    A dry-run only builds the DAG and prints shell commands, so it does
      #    not need conda environments. We intentionally omit --use-conda here:
      #    the CI runner provides micromamba (not `conda`), so
      #    `--conda-frontend conda` would fail with "conda: command not found".
      - name: Dry-run DAG
        run: |
          snakemake -n --printshellcmds --rerun-incomplete --cores 1 --configfile config/config-ci.yaml --until chicago

      # 2b) Downstream smoke test — a dry-run never RUNS the scripts, so this
      #     executes the real R/Perl chain (BamToFragments.pl -> .mat ->
      #     03_Generate_hic_and_TADs.r -> Bam2Juicer.pl -> PRE, plus
      #     align2ibed.pl) on tiny fixtures and asserts the output shapes. It
      #     catches runtime/format bugs (wrong columns, arg counts, CRLF design
      #     files) that the dry-run cannot. This step is REQUIRED (it gates).
      - name: Downstream smoke test (executes the scripts on toy fixtures)
        run: bash tests/smoke_downstream.sh

      # 3) Unit tests (if previously generated and committed)
      - name: Run unit tests (pytest) if available
        run: |
          if [ -d .tests/unit ]; then
            pytest -q .tests/unit
          else
            echo "No .tests/unit found. Generate locally with:"
            echo "  snakemake --use-conda --configfile config/config.yaml --cores 2 --generate-unit-tests"
          fi

      # 4) Optional minimal execution on toy data (enable when ready)
      - name: Minimal end-to-end run (optional)
        if: ${{ false }}   # set to true once you add tiny test data under assets/
        uses: snakemake/snakemake-github-action@v2
        with:
          snakefile: 'Snakefile'
          args: '--cores 1 --use-conda --conda-cleanup-pkgs cache --printshellcmds'
          show-disk-usage-on-error: true
